<!doctype html>
<!--
  Imagem de prévia (LinkedIn, WhatsApp): 1200 x 630.
    chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=frontend/public/og-lucrafood.png marca/og-lucrafood.html
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Sora:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0B5D3B; color: #fff; font-family: Inter, system-ui, sans-serif;
    padding: 72px 80px; position: relative; overflow: hidden;
  }
  body::after { content: ''; position: absolute; right: -90px; top: -90px; width: 320px; height: 320px; border-radius: 50%; background: #EF6A2E; opacity: .22; }
  img { height: 56px; }
  h1 { font-family: Sora, sans-serif; font-size: 66px; line-height: 1.08; letter-spacing: -0.02em; margin: 44px 0 24px; max-width: 900px; }
  p { font-size: 28px; color: rgba(255,255,255,.85); max-width: 900px; }
  .selos { position: absolute; left: 80px; bottom: 64px; display: flex; gap: 14px; }
  .selo { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 22px; padding: 8px 18px 8px 14px; border-radius: 999px; }
  .selo svg { width: 24px; height: 24px; }
  .verde { background: #E3F2E9; color: #0B5D3B; }
  .amarelo { background: #FFF3D1; color: #8A5A00; }
  .vermelho { background: #FDE7E4; color: #B42318; }
</style>
</head>
<body>
  <img src="lucrafood-logo-branco.svg" alt="LucraFood">
  <h1>Quanto sobra de cada prato depois da taxa do app?</h1>
  <p>Foto do cardápio → a IA lê, você confere → o sistema faz a conta.</p>
  <div class="selos">
    <span class="selo verde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Saudável</span>
    <span class="selo amarelo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg>Atenção</span>
    <span class="selo vermelho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Crítico</span>
  </div>
</body>
</html>
